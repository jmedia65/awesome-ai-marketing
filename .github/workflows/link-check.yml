name: Link check

on:
  pull_request:
    paths: ["README.md", "CONTRIBUTING.md", ".github/workflows/link-check.yml"]
  schedule:
    - cron: "0 9 1 * *" # 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200,206,403,429
            --exclude 'ftc\.gov'
            --exclude 'linkedin\.com'
            --exclude 'gemini\.google\.com'
            README.md CONTRIBUTING.md
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue for broken links (monthly run)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: maintenance
